<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Shorts Video Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 40px;
      font-size: 16px;
    }

    .card {
      background: #15151c;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #292933;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      background: #0e0e14;
      color: white;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6c5ce7;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6c5ce7;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5849d6;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      line-height: 1.5;
    }

    .video-box {
      margin-top: 30px;
      display: none;
    }

    video {
      width: 100%;
      border-radius: 15px;
      background: black;
    }

    .download {
      display: block;
      margin-top: 15px;
      padding: 14px;
      text-align: center;
      background: #22222c;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .download:hover {
      background: #30303c;
    }

    .error {
      color: #ff7675;
    }

    .success {
      color: #55efc4;
    }

    .loading {
      color: #ffeaa7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AI Shorts Generator</h1>

    <div class="subtitle">
      Generate a complete AI YouTube Shorts video with one click.
    </div>

    <div class="card">

      <label for="topic">
        Video Topic
      </label>

      <textarea
        id="topic"
        placeholder="Example: Duniya ka sab se ajeeb janwar"
      ></textarea>

      <button id="generateBtn" onclick="generateVideo()">
        Generate Video
      </button>

      <div class="status" id="status">
        Ready — topic enter karo.
      </div>

      <div class="video-box" id="videoBox">

        <video
          id="video"
          controls
          playsinline
        ></video>

        <a
          id="download"
          class="download"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open / Download Video
        </a>

      </div>

    </div>

  </div>


  <script>

    /*
      ============================================
      n8n WEBHOOK URL
      ============================================
    */

    const WEBHOOK_URL =
      "https://afnan804302.app.n8n.cloud/webhook/generate-short";


    /*
      ============================================
      GENERATE VIDEO
      ============================================
    */

    async function generateVideo() {

      const topic =
        document.getElementById("topic").value.trim();

      const button =
        document.getElementById("generateBtn");

      const status =
        document.getElementById("status");

      const videoBox =
        document.getElementById("videoBox");

      const video =
        document.getElementById("video");

      const download =
        document.getElementById("download");


      /*
        Check topic
      */

      if (!topic) {

        status.className = "error";

        status.innerText =
          "Please pehle video topic likho.";

        return;
      }


      /*
        Start loading
      */

      button.disabled = true;

      button.innerText =
        "Generating Video...";

      videoBox.style.display =
        "none";

      status.className = "loading";

      status.innerText =
        "Video generate ho rahi hai... Please wait.";


      try {

        /*
          Send topic to n8n
        */

        const response =
          await fetch(WEBHOOK_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              topic: topic

            })

          });


        /*
          Check HTTP response
        */

        if (!response.ok) {

          throw new Error(
            "n8n server error: " +
            response.status
          );

        }


        /*
          Read n8n JSON response
        */

        const result =
          await response.json();


        console.log(
          "n8n response:",
          result
        );


        /*
          Check video URL
        */

        if (!result.video_url) {

          throw new Error(
            "n8n response mein video_url nahi mila."
          );

        }


        /*
          Put video URL into player
        */

        video.src =
          result.video_url;

        download.href =
          result.video_url;


        /*
          Show video
        */

        videoBox.style.display =
          "block";


        status.className =
          "success";

        status.innerText =
          "✅ Video successfully generated!";


        /*
          Load video
        */

        video.load();


      } catch (error) {

        console.error(
          "Error:",
          error
        );


        status.className =
          "error";


        /*
          Friendly error messages
        */

        if (
          error.message.includes(
            "Failed to fetch"
          )
        ) {

          status.innerText =
            "❌ Connection error. n8n/CORS connection check karo.";

        } else {

          status.innerText =
            "❌ Error: " +
            error.message;

        }

      } finally {

        /*
          Enable button again
        */

        button.disabled =
          false;

        button.innerText =
          "Generate Video";

      }

    }


    /*
      ============================================
      ENTER KEY SUPPORT
      ============================================
    */

    document
      .getElementById("topic")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter" &&
            event.ctrlKey
          ) {

            generateVideo();

          }

        }
      );

  </script>

</body>
</html>
